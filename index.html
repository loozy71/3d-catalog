<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог мастерской</title>

  <!-- 3D viewer. Для первого запуска нужен интернет. Позже можем сделать полностью офлайн. -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }
    header {
      background: #fff;
      padding: 28px 40px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    h1 { margin: 0 0 16px; }
    #search {
      width: 100%;
      max-width: 500px;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    main {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    .photo {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: #eee;
      display: block;
    }
    .info { padding: 18px; }
    .name { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .article { color: #666; margin-bottom: 12px; }
    .details { line-height: 1.6; color: #444; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { opacity: .85; }
    .viewer {
      display: none;
      padding: 18px;
      border-top: 1px solid #eee;
    }
    model-viewer {
      width: 100%;
      height: 420px;
      background: #eee;
      border-radius: 10px;
    }
    .empty { display:none; text-align:center; padding:50px; color:#777; }
  </style>
</head>

<body>
<header>
  <h1>Каталог мастерской</h1>
  <input id="search" type="search" placeholder="Поиск по названию или артикулу...">
</header>

<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">Ничего не найдено</div>
</main>

<script>
const products = [
  {
    name: "Коринфская капитель",
    article: "HL-001",
    material: "Гипс / акрил",
    size: "Укажите размер",
    image: "images/HL-001.jpg",
    model: "models/HL-001.glb"
  }

  // Чтобы добавить изделие, скопируйте блок выше и измените данные.
];

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const search = document.getElementById("search");

function render(filter = "") {
  const q = filter.toLowerCase().trim();
  grid.innerHTML = "";

  const found = products.filter(p =>
    p.name.toLowerCase().includes(q) ||
    p.article.toLowerCase().includes(q)
  );

  empty.style.display = found.length ? "none" : "block";

  found.forEach((p, index) => {
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <img class="photo" src="${p.image}" alt="${p.name}"
           onerror="this.style.display='none'">
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="article">Артикул: ${p.article}</div>
        <div class="details">
          Материал: ${p.material}<br>
          Размер: ${p.size}
        </div>
        <button onclick="toggle3D(${index})">Открыть 3D</button>
      </div>
      <div class="viewer" id="viewer-${index}">
        <model-viewer
          src="${p.model}"
          camera-controls
          auto-rotate
          shadow-intensity="1"
          environment-image="neutral"
          alt="${p.name}">
        </model-viewer>
      </div>
    `;
    grid.appendChild(card);
  });
}

function toggle3D(index) {
  const viewer = document.getElementById(`viewer-${index}`);
  viewer.style.display = viewer.style.display === "block" ? "none" : "block";
}

search.addEventListener("input", e => render(e.target.value));
render();
</script>
</body>
</html>
