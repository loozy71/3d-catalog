<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workshop Catalogue</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:15px 20px;z-index:5}
.top{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:25px}
.actions{display:flex;gap:6px;align-items:center}
.lang{border:0;background:transparent;font-weight:bold;color:#777;padding:6px;cursor:pointer}
.lang.active{color:#111;text-decoration:underline}
.add{border:0;background:#222;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}
main{max-width:1200px;margin:25px auto;padding:0 20px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.cat{border:1px solid #ccc;background:#fff;border-radius:20px;padding:9px 14px;cursor:pointer}
.cat.active{background:#222;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 15px #0001}
.photo{width:100%;height:320px;object-fit:contain;background:#eee;display:block}
.info{padding:18px}.name{font-size:22px;font-weight:bold}
.article{color:#777;margin:7px 0 12px}.details{line-height:1.7}
.model{width:100%;margin-top:15px;padding:13px;border:0;border-radius:9px;background:#222;color:#fff;cursor:pointer}
.no-photo{height:320px;background:#eee;display:flex;align-items:center;justify-content:center;color:#999}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:15px;align-items:center;justify-content:center}
.modal.open{display:flex}
.box{background:#fff;border-radius:15px;padding:24px;width:min(650px,100%);position:relative;max-height:92vh;overflow:auto}
.viewer{padding:0;width:min(950px,100%);height:90vh;overflow:hidden}
.close{position:absolute;right:10px;top:10px;z-index:2;width:42px;height:42px;border:0;border-radius:50%;background:#222;color:#fff;font-size:27px;cursor:pointer}
.viewer model-viewer{width:100%;height:100%}
label{display:block;font-weight:bold;margin:12px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.submit{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#222;color:#fff;cursor:pointer}
.message{min-height:20px;margin:10px 0 0}
.hint{font-size:13px;color:#777;margin-top:5px}
@media(max-width:600px){h1{font-size:20px}.photo,.no-photo{height:280px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">Workshop Catalogue</h1>
    <div class="actions">
      <button id="enBtn" class="lang active">EN</button>
      <button id="czBtn" class="lang">CZ</button>
      <button class="add" id="addBtn">＋ ADD NEW</button>
    </div>
  </div>
</header>

<main>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="admin">
  <div class="box">
    <button class="close" id="closeAdmin">×</button>
    <h2 id="pt">Admin access</h2>
    <p id="px">Enter your admin email and password.</p>
    <label id="emailLabel">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label id="passwordLabel">Password</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="submit" id="cont">Continue</button>
    <p class="message" id="pm"></p>
  </div>
</div>

<div class="modal" id="add">
  <div class="box">
    <button class="close" id="closeAdd">×</button>
    <h2 id="at">Add new product</h2>

    <label id="cl">Category</label>
    <select id="catSel"></select>

    <label id="nameEnLabel">Name EN</label>
    <input id="nameEn">
    <label id="nameCzLabel">Name CZ</label>
    <input id="nameCz">

    <label id="al">Article</label>
    <input id="article">

    <label id="materialEnLabel">Material EN</label>
    <input id="materialEn">
    <label id="materialCzLabel">Material CZ</label>
    <input id="materialCz">

    <label id="sl">Size</label>
    <input id="size">

    <label id="phl">Photo</label>
    <input id="photo" type="file" accept="image/*">
    <div class="hint" id="photoHint">Optional</div>

    <label id="modl">3D model (.glb)</label>
    <input id="model" type="file" accept=".glb">
    <div class="hint" id="modelHint">Optional</div>

    <button class="submit" id="saveProduct">ADD PRODUCT</button>
    <p class="message" id="am"></p>
  </div>
</div>

<div class="modal" id="viewer">
  <div class="box viewer">
    <button class="close" id="closeViewer">×</button>
    <model-viewer id="mv" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pjvpuxdmtomwdcwqvour.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GmUeE90DZHK9DtlN5adMLw_pfA-lof8';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const categoryData=[
  ['cornices','Cornices','Římsy'],
  ['figures','Figures','Figury'],
  ['rocks','Rocks','Skály'],
  ['reliefs','Reliefs','Reliéfy'],
  ['capitals','Capitals','Hlavice']
];

const fallbackProducts=[
  {id:'HL-001',category:'capitals',name_en:'Corinthian Capital',name_cz:'Korintská hlavice',article:'HL-001',material_en:'Plaster / acrylic',material_cz:'Sádra / akryl',size:'—',photo_url:'Hlavice-01.jpg',model_url:'Hlavice-01.glb'},
  {id:'R-002',category:'figures',name_en:'Gargoyle',name_cz:'Chrlič',article:'R-002',material_en:'Plaster / acrylic',material_cz:'Sádra / akryl',size:'300 × 300 mm',photo_url:'Gorgula-01.jpg',model_url:'Gorgula-01.glb'}
];

const T={
 en:{
  title:'Workshop Catalogue',add:'＋ ADD NEW',all:'All',open:'Open 3D model',
  pt:'Admin access',px:'Enter your admin email and password.',email:'Email',password:'Password',cont:'Continue',
  at:'Add new product',cat:'Category',nameEn:'Name EN',nameCz:'Name CZ',article:'Article',
  materialEn:'Material EN',materialCz:'Material CZ',size:'Size',photo:'Photo',model:'3D model (.glb)',
  optional:'Optional',addp:'ADD PRODUCT',loading:'Loading…',saving:'Saving…',
  loginError:'Login failed. Check your email and password.',saveError:'Could not save the product.',
  saved:'Product added successfully.',noProducts:'No products in this category.'
 },
 cz:{
  title:'Katalog dílny',add:'＋ PŘIDAT NOVÝ',all:'Vše',open:'Otevřít 3D model',
  pt:'Přístup správce',px:'Zadejte svůj e-mail a heslo správce.',email:'E-mail',password:'Heslo',cont:'Pokračovat',
  at:'Přidat nový výrobek',cat:'Kategorie',nameEn:'Název EN',nameCz:'Název CZ',article:'Číslo výrobku',
  materialEn:'Materiál EN',materialCz:'Materiál CZ',size:'Rozměr',photo:'Fotografie',model:'3D model (.glb)',
  optional:'Volitelné',addp:'PŘIDAT VÝROBEK',loading:'Načítání…',saving:'Ukládání…',
  loginError:'Přihlášení se nezdařilo. Zkontrolujte e-mail a heslo.',saveError:'Výrobek se nepodařilo uložit.',
  saved:'Výrobek byl úspěšně přidán.',noProducts:'V této kategorii nejsou žádné výrobky.'
 }
};

let lang='en', active='all', products=[];

const $=id=>document.getElementById(id);

function setLang(x){
  lang=x;
  const t=T[x];
  $('title').textContent=t.title; $('addBtn').textContent=t.add;
  $('pt').textContent=t.pt; $('px').textContent=t.px;
  $('emailLabel').textContent=t.email; $('passwordLabel').textContent=t.password; $('cont').textContent=t.cont;
  $('at').textContent=t.at; $('cl').textContent=t.cat; $('nameEnLabel').textContent=t.nameEn; $('nameCzLabel').textContent=t.nameCz;
  $('al').textContent=t.article; $('materialEnLabel').textContent=t.materialEn; $('materialCzLabel').textContent=t.materialCz;
  $('sl').textContent=t.size; $('phl').textContent=t.photo; $('modl').textContent=t.model;
  $('photoHint').textContent=t.optional; $('modelHint').textContent=t.optional; $('saveProduct').textContent=t.addp;
  $('enBtn').classList.toggle('active',x==='en'); $('czBtn').classList.toggle('active',x==='cz');
  renderCats(); render();
}

function renderCats(){
  const wrap=$('cats'); wrap.innerHTML='';
  const all=document.createElement('button');
  all.className='cat '+(active==='all'?'active':''); all.textContent=T[lang].all;
  all.onclick=()=>{active='all';renderCats();render()};
  wrap.appendChild(all);
  categoryData.forEach(c=>{
    const b=document.createElement('button');
    b.className='cat '+(active===c[0]?'active':'');
    b.textContent=c[lang==='en'?1:2];
    b.onclick=()=>{active=c[0];renderCats();render()};
    wrap.appendChild(b);
  });
  $('catSel').innerHTML=categoryData.map(c=>`<option value="${c[0]}">${c[lang==='en'?1:2]}</option>`).join('');
}

function render(){
  const grid=$('grid'); grid.innerHTML='';
  const list=products.filter(p=>active==='all'||p.category===active);
  if(!list.length){grid.innerHTML=`<p>${T[lang].noProducts}</p>`;return}
  list.forEach(p=>{
    const d=document.createElement('article'); d.className='card';
    const photo=p.photo_url
      ? `<img class="photo" src="${escapeAttr(p.photo_url)}" alt="${escapeAttr(p[lang==='en'?'name_en':'name_cz'])}">`
      : `<div class="no-photo">—</div>`;
    d.innerHTML=`${photo}<div class="info">
      <div class="name">${escapeHtml(p[lang==='en'?'name_en':'name_cz']||'—')}</div>
      <div class="article">${escapeHtml(p.article||'')}</div>
      <div class="details"><b>${lang==='en'?'Material:':'Materiál:'}</b> ${escapeHtml(p[lang==='en'?'material_en':'material_cz']||'—')}<br>
      <b>${T[lang].size}:</b> ${escapeHtml(p.size||'—')}</div>
      ${p.model_url?`<button class="model">${T[lang].open}</button>`:''}
    </div>`;
    if(p.model_url)d.querySelector('.model').onclick=()=>{
      $('mv').src=p.model_url; $('viewer').classList.add('open');
    };
    grid.appendChild(d);
  });
}

async function loadProducts(){
  $('grid').innerHTML=`<p>${T[lang].loading}</p>`;
  const {data,error}=await db.from('products').select('*').order('article',{ascending:true});
  if(error){
    console.error(error);
    products=[...fallbackProducts];
  }else{
    const map=new Map(fallbackProducts.map(p=>[p.id,p]));
    (data||[]).forEach(p=>map.set(p.id,{
      id:p.id,category:p.category,name_en:p.name_en||'',name_cz:p.name_cz||'',
      article:p.article||'',material_en:p.material_en||'',material_cz:p.material_cz||'',
      size:p.size||'—',photo_url:p.photo_url||'',model_url:p.model_url||''
    }));
    products=[...map.values()];
  }
  renderCats(); render();
}

async function login(){
  $('pm').textContent='';
  const email=$('email').value.trim(), password=$('pass').value;
  if(!email||!password){$('pm').textContent=T[lang].loginError;return}
  $('cont').disabled=true;
  const {error}=await db.auth.signInWithPassword({email,password});
  $('cont').disabled=false;
  if(error){$('pm').textContent=T[lang].loginError;return}
  $('pass').value=''; closeModal('admin'); openModal('add');
}

async function uploadFile(file,prefix){
  if(!file)return '';
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=`${prefix}/${Date.now()}-${Math.random().toString(36).slice(2)}-${safe}`;
  const {error}=await db.storage.from('products').upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(error)throw error;
  const {data}=db.storage.from('products').getPublicUrl(path);
  return data.publicUrl;
}

async function addProduct(){
  $('am').textContent='';
  const nameEn=$('nameEn').value.trim(), nameCz=$('nameCz').value.trim();
  if(!nameEn && !nameCz){$('am').textContent=lang==='en'?'Enter at least one name.':'Zadejte alespoň jeden název.';return}
  $('saveProduct').disabled=true; $('saveProduct').textContent=T[lang].saving;
  try{
    const photoFile=$('photo').files[0]||null, modelFile=$('model').files[0]||null;
    const photoUrl=await uploadFile(photoFile,'photos');
    const modelUrl=await uploadFile(modelFile,'models');
    const row={
      category:$('catSel').value,
      name_en:nameEn||nameCz,
      name_cz:nameCz||nameEn,
      article:$('article').value.trim(),
      material_en:$('materialEn').value.trim(),
      material_cz:$('materialCz').value.trim(),
      size:$('size').value.trim(),
      photo_url:photoUrl||null,
      model_url:modelUrl||null
    };
    const {error}=await db.from('products').insert(row);
    if(error)throw error;
    $('am').textContent=T[lang].saved;
    ['nameEn','nameCz','article','materialEn','materialCz','size','photo','model'].forEach(id=>$(id).value='');
    await loadProducts();
    setTimeout(()=>closeModal('add'),700);
  }catch(e){
    console.error(e); $('am').textContent=T[lang].saveError+' '+(e.message||'');
  }finally{
    $('saveProduct').disabled=false; $('saveProduct').textContent=T[lang].addp;
  }
}

function openModal(id){$(id).classList.add('open')}
function closeModal(id){$(id).classList.remove('open')}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function escapeAttr(s){return escapeHtml(s)}

$('enBtn').onclick=()=>setLang('en');
$('czBtn').onclick=()=>setLang('cz');
$('addBtn').onclick=()=>{openModal('admin');$('email').focus()};
$('cont').onclick=login;
$('saveProduct').onclick=addProduct;
$('closeAdmin').onclick=()=>closeModal('admin');
$('closeAdd').onclick=()=>closeModal('add');
$('closeViewer').onclick=()=>{closeModal('viewer');$('mv').src=''};

['admin','add','viewer'].forEach(id=>{
  $(id).addEventListener('click',e=>{if(e.target===$(id))closeModal(id)});
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'));
});

setLang('en');
loadProducts();
</script>
</body>
</html>
