<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workshop Catalogue</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:15px 20px;z-index:5}
.top{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:25px}.actions{display:flex;gap:6px;align-items:center}
.lang{border:0;background:transparent;font-weight:bold;color:#777;padding:6px;cursor:pointer}.lang.active{color:#111;text-decoration:underline}
.add{border:0;background:#222;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}
main{max-width:1200px;margin:25px auto;padding:0 20px}.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.cat{border:1px solid #ccc;background:#fff;border-radius:20px;padding:9px 14px;cursor:pointer}.cat.active{background:#222;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 15px #0001}
.photo{width:100%;height:320px;object-fit:contain;background:#eee;display:block}.info{padding:18px}.name{font-size:22px;font-weight:bold}
.article{color:#777;margin:7px 0 12px}.details{line-height:1.7}.model{width:100%;margin-top:15px;padding:13px;border:0;border-radius:9px;background:#222;color:#fff;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:15px;align-items:center;justify-content:center}.modal.open{display:flex}
.box{background:#fff;border-radius:15px;padding:24px;width:min(650px,100%);position:relative}.viewer{padding:0;width:min(950px,100%);height:90vh;overflow:hidden}
.close{position:absolute;right:10px;top:10px;z-index:2;width:42px;height:42px;border:0;border-radius:50%;background:#222;color:#fff;font-size:27px}
.viewer model-viewer{width:100%;height:100%}label{display:block;font-weight:bold;margin:12px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px}.submit{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#222;color:#fff}
@media(max-width:600px){h1{font-size:20px}.photo{height:280px}}
</style></head><body>
<header><div class="top"><h1 id="title">Workshop Catalogue</h1><div class="actions">
<button id="enBtn" class="lang active" onclick="setLang('en')">EN</button><button id="czBtn" class="lang" onclick="setLang('cz')">CZ</button>
<button class="add" id="addBtn" onclick="openAdmin()">＋ ADD NEW</button></div></div></header>
<main><div class="cats" id="cats"></div><div class="grid" id="grid"></div></main>

<div class="modal" id="admin"><div class="box"><button class="close" onclick="closeM('admin')">×</button>
<h2 id="pt">Admin access</h2><p id="px">Enter password to add a product.</p>
<input id="pass" type="password"><button class="submit" onclick="unlock()" id="cont">Continue</button><p id="pm"></p></div></div>

<div class="modal" id="add"><div class="box"><button class="close" onclick="closeM('add')">×</button>
<h2 id="at">Add new product</h2>
<label id="cl">Category</label><select id="catSel"></select>
<label id="nl">Name</label><input id="name">
<label id="al">Article</label><input id="article">
<label id="ml">Material</label><input id="material">
<label id="sl">Size</label><input id="size">
<label>Name EN</label><input id="nameEn">
<label>Name CZ</label><input id="nameCz">
<label id="phl">Photo</label><input id="photo" type="file" accept="image/*">
<label id="modl">3D model (.glb)</label><input id="model" type="file" accept=".glb">
<button class="submit" onclick="addProduct()" id="addProduct">ADD PRODUCT</button>
<p id="am"></p></div></div>

<div class="modal" id="viewer"><div class="box viewer"><button class="close" onclick="closeM('viewer')">×</button>
<model-viewer id="mv" camera-controls auto-rotate shadow-intensity="1"></model-viewer></div></div>

<script>
const categoryData=[['cornices','Cornices','Římsy'],['figures','Figures','Figury'],['rocks','Rocks','Skály'],['reliefs','Reliefs','Reliéfy'],['capitals','Capitals','Hlavice']];
let lang='en',active='all';
let products=[
{id:'HL-001',cat:'capitals',en:'Corinthian Capital',cz:'Korintská hlavice',article:'HL-001',men:'Plaster / acrylic',mcz:'Sádra / akryl',size:'—',photo:'Hlavice-01.jpg',model:'Hlavice-01.glb'},
{id:'R-002',cat:'figures',en:'Gargoyle',cz:'Chrlič',article:'R-002',men:'Plaster / acrylic',mcz:'Sádra / akryl',size:'300 × 300 mm',photo:'Gorgula-01.jpg',model:'Gorgula-01.glb'}];
const T={en:{title:'Workshop Catalogue',add:'＋ ADD NEW',all:'All',open:'Open 3D model',pt:'Admin access',px:'Enter password to add a product.',cont:'Continue',at:'Add new product',cat:'Category',name:'Name',article:'Article',material:'Material',size:'Size',photo:'Photo',model:'3D model (.glb)',addp:'ADD PRODUCT',wrong:'Incorrect password.'},
cz:{title:'Katalog dílny',add:'＋ PŘIDAT NOVÝ',all:'Vše',open:'Otevřít 3D model',pt:'Přístup správce',px:'Zadejte heslo pro přidání výrobku.',cont:'Pokračovat',at:'Přidat nový výrobek',cat:'Kategorie',name:'Název',article:'Číslo výrobku',material:'Materiál',size:'Rozměr',photo:'Fotografie',model:'3D model (.glb)',addp:'PŘIDAT VÝROBEK',wrong:'Nesprávné heslo.'}};
function setLang(x){
  lang=x; const t=T[x];
  document.getElementById('title').textContent=t.title;
  document.getElementById('addBtn').textContent=t.add;
  document.getElementById('pt').textContent=t.pt; document.getElementById('px').textContent=t.px;
  document.getElementById('cont').textContent=t.cont; document.getElementById('at').textContent=t.at;
  document.getElementById('cl').textContent=t.cat; document.getElementById('nl').textContent=t.name;
  document.getElementById('al').textContent=t.article; document.getElementById('ml').textContent=t.material;
  document.getElementById('sl').textContent=t.size; document.getElementById('phl').textContent=t.photo;
  document.getElementById('modl').textContent=t.model; document.getElementById('addProduct').textContent=t.addp;
  document.getElementById('enBtn').classList.toggle('active',x==='en');
  document.getElementById('czBtn').classList.toggle('active',x==='cz');
  renderCats(); render();
}
function renderCats(){
  const wrap=document.getElementById('cats'); wrap.innerHTML='';
  const all=document.createElement('button'); all.className='cat '+(active==='all'?'active':''); all.textContent=T[lang].all;
  all.onclick=()=>{active='all';renderCats();render()}; wrap.appendChild(all);
  categoryData.forEach(c=>{const q=document.createElement('button');q.className='cat '+(active===c[0]?'active':'');
    q.textContent=c[lang==='en'?1:2];q.onclick=()=>{active=c[0];renderCats();render()};wrap.appendChild(q);});
  document.getElementById('catSel').innerHTML=categoryData.map(c=>'<option value="'+c[0]+'">'+c[lang==='en'?1:2]+'</option>').join('');
}
function render(){
  const wrap=document.getElementById('grid'); wrap.innerHTML='';
  const list=products.filter(p=>active==='all'||p.cat===active);
  list.forEach(p=>{
    const d=document.createElement('article'); d.className='card';
    d.innerHTML='<img class="photo" src="'+(p.photo||'')+'" alt="'+p[lang]+'"><div class="info"><div class="name">'+p[lang]+'</div><div class="article">'+p.article+'</div><div class="details"><b>'+T[lang].material+':</b> '+p['m'+lang]+'<br><b>'+T[lang].size+':</b> '+p.size+'</div>'+(p.model?'<button class="model">'+T[lang].open+'</button>':'')+'</div>';
    if(p.model)d.querySelector('.model').onclick=()=>{document.getElementById('mv').src=p.model;document.getElementById('viewer').classList.add('open')};
    wrap.appendChild(d);
  });
  if(!list.length)wrap.innerHTML='<div class="empty">'+(lang==='en'?'No products in this category.':'V této kategorii nejsou žádné výrobky.')+'</div>';
}
function openAdmin(){document.getElementById('admin').classList.add('open');document.getElementById('pass').focus()}
function closeM(x){document.getElementById(x).classList.remove('open')}
function unlock(){if(document.getElementById('pass').value==='CHANGE_ME'){closeM('admin');document.getElementById('add').classList.add('open');document.getElementById('pass').value='';}else document.getElementById('pm').textContent=T[lang].wrong}
function addProduct(){
  const photoFile=document.getElementById('photo').files[0], modelFile=document.getElementById('model').files[0];
  products.push({id:document.getElementById('article').value||Date.now(),cat:document.getElementById('catSel').value,
    en:document.getElementById('nameEn').value||document.getElementById('name').value||'Untitled',
    cz:document.getElementById('nameCz').value||document.getElementById('name').value||'Bez názvu',
    article:document.getElementById('article').value||'',men:document.getElementById('material').value||'—',
    mcz:document.getElementById('material').value||'—',size:document.getElementById('size').value||'—',
    photo:photoFile?URL.createObjectURL(photoFile):'',model:modelFile?URL.createObjectURL(modelFile):''});
  render();closeM('add');
}
renderCats();render();
