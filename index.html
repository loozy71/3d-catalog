<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог мастерской</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#fff;padding:28px 24px;border-bottom:1px solid #ddd}
h1{margin:0 0 8px;font-size:28px}
header p{margin:0;color:#666}
main{max-width:1000px;margin:30px auto;padding:0 20px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 16px rgba(0,0,0,.1)}
.photo{width:100%;display:block;max-height:560px;object-fit:contain;background:#eee}
.info{padding:24px}
.name{font-size:24px;font-weight:700;margin-bottom:8px}
.article{color:#666;margin-bottom:18px;font-size:18px}
.details{line-height:1.7;font-size:17px}
button{margin-top:22px;padding:14px 20px;border:0;border-radius:10px;background:#222;color:#fff;font-size:17px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;padding:20px}
.modal.open{display:flex;align-items:center;justify-content:center}
.modal-box{position:relative;width:min(1000px,100%);height:min(90vh,800px);background:#fff;border-radius:16px;overflow:hidden}
.close{position:absolute;right:12px;top:12px;z-index:2;width:46px;height:46px;margin:0;padding:0;border-radius:50%;background:#222;color:#fff;font-size:30px;line-height:46px}
model-viewer{width:100%;height:100%;background:#eee}
@media(max-width:600px){
.modal{padding:8px}
.modal-box{height:92vh;border-radius:12px}
.name{font-size:22px}
}
</style>
</head>
