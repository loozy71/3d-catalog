<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workshop Catalogue</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;z-index:5}
.brand{width:100%;border-bottom:1px solid #e5e5e5;background:#fff;display:flex;align-items:center;justify-content:center;min-height:96px;padding:16px 20px 14px}
.brand-name{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:clamp(42px,6vw,72px);font-weight:300;line-height:1;letter-spacing:.43em;padding-left:.43em;color:#4d5660;text-align:center;white-space:nowrap}
.header-main{padding:15px 20px}
.top{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:25px}
.actions{display:flex;gap:6px;align-items:center}
.lang{border:0;background:transparent;font-weight:bold;color:#777;padding:6px;cursor:pointer}
.lang.active{color:#111;text-decoration:underline}
.add{border:0;background:#222;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}
main{max-width:1200px;margin:25px auto;padding:0 20px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.cat{border:1px solid #ccc;background:#fff;border-radius:20px;padding:9px 14px;cursor:pointer}
.cat.active{background:#222;color:#fff}
.search-row{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.search{flex:1;width:100%;padding:13px 15px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff;min-width:0}
.view-toggle{display:flex;gap:4px;flex:0 0 auto;background:#fff;border:1px solid #ccc;border-radius:10px;padding:3px}
.view-btn{width:42px;height:40px;border:0;border-radius:7px;background:transparent;color:#777;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:21px}
.view-btn.active{background:#222;color:#fff}
.view-btn svg{width:20px;height:20px}

.card-actions{display:flex;gap:8px;margin-top:10px}.edit{background:#eee;color:#222}.delete{background:#b3261e;color:#fff}.card-actions button{flex:1;padding:10px;border:0;border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 15px #0001}
.grid.list-view{display:flex;flex-direction:column;gap:10px}
.grid.list-view .card{display:grid;grid-template-columns:105px minmax(0,1fr);min-height:105px;border-radius:10px;box-shadow:0 1px 7px #0001}
.grid.list-view .photo-carousel,.grid.list-view .photo,.grid.list-view .no-photo{width:105px;height:105px;min-height:105px}
.grid.list-view .photo-track{width:105px}
.grid.list-view .carousel-arrow{width:28px;height:28px;line-height:28px;font-size:19px}
.grid.list-view .carousel-prev{left:5px}.grid.list-view .carousel-next{right:5px}
.grid.list-view .carousel-dots{bottom:5px;gap:4px}
.grid.list-view .carousel-dot{width:5px;height:5px}
.grid.list-view .info{padding:11px 14px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.grid.list-view .name{font-size:17px;line-height:1.25}
.grid.list-view .article{font-size:13px;margin:3px 0 5px}
.grid.list-view .details{font-size:13px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.list-view .model{width:max-content;margin-top:6px;padding:6px 9px;font-size:12px}
.grid.list-view .card-actions{margin-top:6px;gap:5px}
.grid.list-view .card-actions button{padding:5px;font-size:12px}

.photo-carousel{position:relative;width:100%;height:320px;background:#eee;overflow:hidden}
.photo-track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;touch-action:pan-x}
.photo-track::-webkit-scrollbar{display:none}
.photo-slide{min-width:100%;height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center}
.photo-slide img{width:100%;height:100%;object-fit:contain;display:block}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:#0009;color:#fff;font-size:24px;line-height:36px;padding:0;cursor:pointer;z-index:2}
.carousel-prev{left:10px}.carousel-next{right:10px}
.carousel-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;z-index:2}
.carousel-dot{width:7px;height:7px;border:0;border-radius:50%;background:#fff9;padding:0;cursor:pointer}
.carousel-dot.active{background:#222}
.photo{width:100%;height:320px;object-fit:contain;background:#eee;display:block}
.info{padding:18px}.name{font-size:22px;font-weight:bold}
.article{color:#777;margin:7px 0 12px}.details{line-height:1.7}
.model{width:100%;margin-top:15px;padding:13px;border:0;border-radius:9px;background:#222;color:#fff;cursor:pointer}
.no-photo{height:320px;background:#eee;display:flex;align-items:center;justify-content:center;color:#999}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:15px;align-items:center;justify-content:center}
.modal.open{display:flex}
.box{background:#fff;border-radius:15px;padding:24px;width:min(650px,100%);position:relative;max-height:92vh;overflow:auto}
.viewer{padding:0;width:min(950px,100%);height:90vh;overflow:hidden}
.close{position:absolute;right:10px;top:10px;z-index:2;width:42px;height:42px;border:0;border-radius:50%;background:#222;color:#fff;font-size:27px;cursor:pointer}
.viewer model-viewer{width:100%;height:100%}
label{display:block;font-weight:bold;margin:12px 0 5px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:16px}
.submit{width:100%;margin-top:18px;padding:13px;border:0;border-radius:9px;background:#222;color:#fff;cursor:pointer}
.message{min-height:20px;margin:10px 0 0}
.hint{font-size:13px;color:#777;margin-top:5px}
@media(max-width:600px){.brand{min-height:76px;padding:13px 12px 11px}.brand-name{font-size:38px;letter-spacing:.27em;padding-left:.27em}h1{font-size:20px}.photo,.no-photo{height:280px}.search-row{gap:7px}.view-btn{width:38px;height:38px}.grid.list-view .card{grid-template-columns:88px minmax(0,1fr);min-height:88px}.grid.list-view .photo-carousel,.grid.list-view .photo,.grid.list-view .no-photo{width:88px;height:88px;min-height:88px}.grid.list-view .photo-track{width:88px}.grid.list-view .info{padding:9px 11px}.grid.list-view .name{font-size:15px}.grid.list-view .details{font-size:12px}}
</style>
</head>
<body>
<header>
  <div class="brand" aria-label="Taurus">
    <div class="brand-name">TAURUS</div>
  </div>
  <div class="header-main">
    <div class="top">
    <h1 id="title">Workshop Catalogue</h1>
    <div class="actions">
      <button id="enBtn" class="lang active">EN</button>
      <button id="czBtn" class="lang">CZ</button>
      <button type="button" class="add" id="addBtn" onclick="openModal('admin')">＋ ADD NEW</button>
    </div>
  </div>
</header>

<main>
  <div class="search-row">
    <input class="search" id="search" placeholder="Search by name or article">
    <div class="view-toggle" aria-label="View mode">
      <button type="button" class="view-btn active" id="gridViewBtn" title="Grid view" aria-label="Grid view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
      <button type="button" class="view-btn" id="listViewBtn" title="List view" aria-label="List view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="admin">
  <div class="box">
    <button class="close" id="closeAdmin">×</button>
    <h2 id="pt">Admin access</h2>
    <p id="px">Enter your admin email and password.</p>
    <p class="hint" id="policyHint">Access uses Supabase authenticated policies: INSERT, UPDATE and DELETE.</p>
    <label id="emailLabel">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label id="passwordLabel">Password</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="submit" id="cont">Continue</button>
    <p class="message" id="pm"></p>
  </div>
</div>

<div class="modal" id="add">
  <div class="box">
    <button class="close" id="closeAdd">×</button>
    <h2 id="at">Add new product</h2>

    <label id="cl">Category</label>
    <select id="catSel"></select>

    <label id="nameEnLabel">Name EN</label>
    <input id="nameEn">
    <label id="nameCzLabel">Name CZ</label>
    <input id="nameCz">

    <label id="al">Article</label>
    <input id="article">

    <label id="materialEnLabel">Material EN</label>
    <input id="materialEn">
    <label id="materialCzLabel">Material CZ</label>
    <input id="materialCz">

    <label id="sl">Size</label>
    <input id="size">

    <label id="phl">Photos</label>
    <input id="photo" type="file" accept="image/*" multiple>
    <div class="hint" id="photoHint">Optional — select several photos</div>

    <label id="modl">3D model (.glb)</label>
    <input id="model" type="file" accept=".glb">
    <div class="hint" id="modelHint">Optional</div>

    <button class="submit" id="saveProduct">ADD PRODUCT</button>
    <p class="message" id="am"></p>
  </div>
</div>


<div class="modal" id="edit">
  <div class="box">
    <button class="close" id="closeEdit">×</button>
    <h2 id="et">Edit product</h2>
    <input id="editId" type="hidden">

    <label id="ecl">Category</label>
    <select id="editCatSel"></select>

    <label id="enameEnLabel">Name EN</label>
    <input id="editNameEn">
    <label id="enameCzLabel">Name CZ</label>
    <input id="editNameCz">

    <label id="eal">Article</label>
    <input id="editArticle">

    <label id="ematerialEnLabel">Material EN</label>
    <input id="editMaterialEn">
    <label id="ematerialCzLabel">Material CZ</label>
    <input id="editMaterialCz">

    <label id="esl">Size</label>
    <input id="editSize">

    <label id="ephl">Add photos</label>
    <input id="editPhoto" type="file" accept="image/*" multiple>
    <div class="hint" id="ephotoHint">Leave empty to keep current photos</div>

    <label id="emodl">New 3D model (.glb)</label>
    <input id="editModel" type="file" accept=".glb">
    <div class="hint" id="emodelHint">Leave empty to keep the current model</div>

    <button class="submit" id="updateProduct">SAVE CHANGES</button>
    <p class="message" id="em"></p>
  </div>
</div>

<div class="modal" id="viewer">
  <div class="box viewer">
    <button class="close" id="closeViewer">×</button>
    <model-viewer id="mv" camera-controls auto-rotate shadow-intensity="1" exposure="1"></model-viewer>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pjvpuxdmtomwdcwqvour.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GmUeE90DZHK9DtlN5adMLw_pfA-lof8';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
// RLS policy names in Supabase do not need to match these names; the important parts are
// SELECT for public, and INSERT / UPDATE / DELETE for authenticated users.

const categoryData=[
  ['cornices','Cornices','Římsy'],
  ['figures','Figures','Figury'],
  ['rocks','Rocks','Skály'],
  ['reliefs','Reliefs','Reliéfy'],
  ['capitals','Capitals','Hlavice']
];

const fallbackProducts=[
  {id:'HL-001',category:'capitals',name_en:'Corinthian Capital',name_cz:'Korintská hlavice',article:'HL-001',material_en:'Plaster / acrylic',material_cz:'Sádra / akryl',size:'—',photo_url:'Hlavice-01.jpg',model_url:'Hlavice-01.glb'},
  {id:'R-002',category:'figures',name_en:'Gargoyle',name_cz:'Chrlič',article:'R-002',material_en:'Plaster / acrylic',material_cz:'Sádra / akryl',size:'300 × 300 mm',photo_url:'Gorgula-01.jpg',model_url:'Gorgula-01.glb'}
];

const T={
 en:{
  title:'Workshop Catalogue',add:'＋ ADD NEW',all:'All',open:'Open 3D model',
  pt:'Admin access',px:'Enter your admin email and password.',email:'Email',password:'Password',cont:'Continue', policyHint:'Access uses Supabase authenticated policies: INSERT, UPDATE and DELETE.',
  at:'Add new product',cat:'Category',nameEn:'Name EN',nameCz:'Name CZ',article:'Article',
  materialEn:'Material EN',materialCz:'Material CZ',size:'Size',photo:'Photos',model:'3D model (.glb)',
  optional:'Optional — select several photos',addp:'ADD PRODUCT',loading:'Loading…',saving:'Saving…',
  loginError:'Login failed. Check your email and password.',saveError:'Could not save the product.',
  saved:'Product added successfully.',noProducts:'No products in this category.',search:'Search by name or article',edit:'Edit',delete:'Delete',confirmDelete:'Delete this product?',savedEdit:'Changes saved.',editError:'Could not update the product.',leaveEmpty:'Leave empty to keep current files',saveChanges:'SAVE CHANGES'
 },
 cz:{
  title:'Katalog dílny',add:'＋ PŘIDAT NOVÝ',all:'Vše',open:'Otevřít 3D model',
  pt:'Přístup správce',px:'Zadejte svůj e-mail a heslo správce.',email:'E-mail',password:'Heslo',cont:'Pokračovat', policyHint:'Přístup používá zásady Supabase pro ověřené uživatele: INSERT, UPDATE a DELETE.',
  at:'Přidat nový výrobek',cat:'Kategorie',nameEn:'Název EN',nameCz:'Název CZ',article:'Číslo výrobku',
  materialEn:'Materiál EN',materialCz:'Materiál CZ',size:'Rozměr',photo:'Fotografie',model:'3D model (.glb)',
  optional:'Volitelné — vyberte více fotografií',addp:'PŘIDAT VÝROBEK',loading:'Načítání…',saving:'Ukládání…',
  loginError:'Přihlášení se nezdařilo. Zkontrolujte e-mail a heslo.',saveError:'Výrobek se nepodařilo uložit.',
  saved:'Výrobek byl úspěšně přidán.',noProducts:'V této kategorii nejsou žádné výrobky.',search:'Hledat podle názvu nebo čísla výrobku',edit:'Upravit',delete:'Smazat',confirmDelete:'Smazat tento výrobek?',savedEdit:'Změny byly uloženy.',editError:'Výrobek se nepodařilo upravit.',leaveEmpty:'Ponechte prázdné pro zachování současných souborů',saveChanges:'ULOŽIT ZMĚNY'
 }
};

let lang='en', active='all', products=[];
let viewMode=localStorage.getItem('workshop_catalog_view')==='list'?'list':'grid';
let isAdmin=false;

const $=id=>document.getElementById(id);

function setLang(x){
  lang=x;
  const t=T[x];
  $('title').textContent=t.title; $('addBtn').textContent=t.add;
  $('pt').textContent=t.pt; $('px').textContent=t.px; $('policyHint').textContent=t.policyHint;
  $('emailLabel').textContent=t.email; $('passwordLabel').textContent=t.password; $('cont').textContent=t.cont;
  $('at').textContent=t.at; $('cl').textContent=t.cat; $('et').textContent=t.edit; $('ecl').textContent=t.cat; $('nameEnLabel').textContent=t.nameEn; $('nameCzLabel').textContent=t.nameCz;
  $('al').textContent=t.article; $('materialEnLabel').textContent=t.materialEn; $('materialCzLabel').textContent=t.materialCz;
  $('sl').textContent=t.size; $('phl').textContent=t.photo; $('modl').textContent=t.model;
  $('photoHint').textContent=t.optional; $('modelHint').textContent=t.optional; $('saveProduct').textContent=t.addp;
  $('enameEnLabel').textContent=t.nameEn; $('enameCzLabel').textContent=t.nameCz; $('eal').textContent=t.article; $('ematerialEnLabel').textContent=t.materialEn; $('ematerialCzLabel').textContent=t.materialCz; $('esl').textContent=t.size; $('ephl').textContent=t.photo; $('emodl').textContent=t.model; $('ephotoHint').textContent=t.leaveEmpty; $('emodelHint').textContent=t.leaveEmpty; $('updateProduct').textContent=t.saveChanges; $('search').placeholder=t.search;
  $('enBtn').classList.toggle('active',x==='en'); $('czBtn').classList.toggle('active',x==='cz');
  renderCats(); render();
}

function renderCats(){
  const wrap=$('cats'); wrap.innerHTML='';
  const all=document.createElement('button');
  all.className='cat '+(active==='all'?'active':''); all.textContent=T[lang].all;
  all.onclick=()=>{active='all';renderCats();render()};
  wrap.appendChild(all);
  categoryData.forEach(c=>{
    const b=document.createElement('button');
    b.className='cat '+(active===c[0]?'active':'');
    b.textContent=c[lang==='en'?1:2];
    b.onclick=()=>{active=c[0];renderCats();render()};
    wrap.appendChild(b);
  });
  $('catSel').innerHTML=categoryData.map(c=>`<option value="${c[0]}">${c[lang==='en'?1:2]}</option>`).join('');
}

function normalizePhotos(p){
  let arr=[];
  if(Array.isArray(p.photo_urls)) arr=p.photo_urls.filter(Boolean);
  else if(typeof p.photo_urls==='string'){
    try{ const x=JSON.parse(p.photo_urls); if(Array.isArray(x)) arr=x.filter(Boolean); }catch(_){}
  }
  if(!arr.length && p.photo_url) arr=[p.photo_url];
  return [...new Set(arr)];
}

function renderPhotoCarousel(p){
  const photos=normalizePhotos(p);
  if(!photos.length) return `<div class="no-photo">—</div>`;
  if(photos.length===1){
    return `<div class="photo-carousel"><div class="photo-slide"><img class="photo" src="${escapeAttr(photos[0])}" alt="${escapeAttr(p[lang==='en'?'name_en':'name_cz'])}"></div></div>`;
  }
  const slides=photos.map((url,i)=>`<div class="photo-slide"><img class="photo" src="${escapeAttr(url)}" alt="${escapeAttr(p[lang==='en'?'name_en':'name_cz'])} — ${i+1}"></div>`).join('');
  const dots=photos.map((_,i)=>`<button class="carousel-dot ${i===0?'active':''}" data-index="${i}" aria-label="${i+1}"></button>`).join('');
  return `<div class="photo-carousel">
    <div class="photo-track">${slides}</div>
    <button class="carousel-arrow carousel-prev" aria-label="Previous">‹</button>
    <button class="carousel-arrow carousel-next" aria-label="Next">›</button>
    <div class="carousel-dots">${dots}</div>
  </div>`;
}

function attachCarousel(d){
  const track=d.querySelector('.photo-track');
  if(!track)return;
  const slides=[...track.querySelectorAll('.photo-slide')];
  const dots=[...d.querySelectorAll('.carousel-dot')];
  const go=i=>{ const idx=Math.max(0,Math.min(slides.length-1,i)); track.scrollTo({left:track.clientWidth*idx,behavior:'smooth'}); };
  d.querySelector('.carousel-prev').onclick=()=>go(Math.round(track.scrollLeft/track.clientWidth)-1);
  d.querySelector('.carousel-next').onclick=()=>go(Math.round(track.scrollLeft/track.clientWidth)+1);
  dots.forEach(dot=>dot.onclick=()=>go(Number(dot.dataset.index)));
  track.addEventListener('scroll',()=>{
    const idx=Math.round(track.scrollLeft/Math.max(1,track.clientWidth));
    dots.forEach((dot,i)=>dot.classList.toggle('active',i===idx));
  },{passive:true});
}

function setViewMode(mode){
  viewMode=mode==='list'?'list':'grid';
  localStorage.setItem('workshop_catalog_view',viewMode);
  $('gridViewBtn').classList.toggle('active',viewMode==='grid');
  $('listViewBtn').classList.toggle('active',viewMode==='list');
  $('gridViewBtn').setAttribute('aria-pressed',viewMode==='grid');
  $('listViewBtn').setAttribute('aria-pressed',viewMode==='list');
  render();
}

function render(){
  const grid=$('grid'); grid.innerHTML=''; grid.classList.toggle('list-view',viewMode==='list');
  const q=$('search').value.trim().toLowerCase();
  const list=products.filter(p=>{
    const catOk=active==='all'||p.category===active;
    const text=[p.name_en,p.name_cz,p.article,p.material_en,p.material_cz,p.size].join(' ').toLowerCase();
    return catOk && (!q || text.includes(q));
  });
  if(!list.length){grid.innerHTML=`<p>${T[lang].noProducts}</p>`;return}
  list.forEach(p=>{
    const d=document.createElement('article'); d.className='card';
    const photo=renderPhotoCarousel(p);
    const adminButtons=(isAdmin && p._db) ? `<div class="card-actions"><button class="edit">${T[lang].edit}</button><button class="delete">${T[lang].delete}</button></div>` : '';
    d.innerHTML=`${photo}<div class="info">
      <div class="name">${escapeHtml(p[lang==='en'?'name_en':'name_cz']||'—')}</div>
      <div class="article">${escapeHtml(p.article||'')}</div>
      <div class="details"><b>${lang==='en'?'Material:':'Materiál:'}</b> ${escapeHtml(p[lang==='en'?'material_en':'material_cz']||'—')}<br>
      <b>${T[lang].size}:</b> ${escapeHtml(p.size||'—')}</div>
      ${p.model_url?`<button class="model">${T[lang].open}</button>`:''}
      ${adminButtons}
    </div>`;
    attachCarousel(d);
    if(p.model_url)d.querySelector('.model').onclick=()=>{
      $('mv').src=p.model_url; $('viewer').classList.add('open');
    };
    if(p._db && isAdmin){
      const editBtn=d.querySelector('.edit');
      const deleteBtn=d.querySelector('.delete');
      if(editBtn) editBtn.onclick=()=>openEdit(p);
      if(deleteBtn) deleteBtn.onclick=()=>deleteProduct(p);
    }
    grid.appendChild(d);
  });
}

const CACHE_KEY='workshop_catalog_products_v1';

function saveProductsCache(list){
  try{
    localStorage.setItem(CACHE_KEY,JSON.stringify({savedAt:Date.now(),products:list}));
  }catch(e){ console.warn('Could not save catalogue cache:',e); }
}

function getProductsCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    if(!raw)return null;
    const parsed=JSON.parse(raw);
    return Array.isArray(parsed.products)?parsed.products:null;
  }catch(e){return null}
}

async function loadProducts(){
  $('grid').innerHTML=`<p>${T[lang].loading}</p>`;
  try{
    const {data,error}=await db.from('products').select('*').order('article',{ascending:true});
    if(error) throw error;

    products=(data||[]).map(p=>({
      id:p.id,category:p.category,name_en:p.name_en||'',name_cz:p.name_cz||'',
      article:p.article||'',material_en:p.material_en||'',material_cz:p.material_cz||'',
      size:p.size||'—',photo_url:p.photo_url||'',photo_urls:p.photo_urls||[],
      model_url:p.model_url||'',_db:true
    }));
    saveProductsCache(products);
    renderCats(); render();
  }catch(error){
    console.error('Supabase products SELECT error:',error);
    const cached=getProductsCache();
    if(cached && cached.length){
      products=cached;
      renderCats(); render();
      const note=document.createElement('div');
      note.style='max-width:1200px;margin:0 auto 18px;padding:10px 14px;background:#fff4d6;border:1px solid #e6c96a;border-radius:9px;color:#6b5200';
      note.textContent=lang==='en'?'Offline copy shown — the online database is temporarily unavailable.':'Zobrazena offline kopie — online databáze je dočasně nedostupná.';
      $('grid').before(note);
      return;
    }
    // First visit / no cache: keep a small local emergency catalogue.
    products=fallbackProducts.map(p=>({...p,_db:false}));
    renderCats(); render();
  }
}

async function login(){
  $('pm').textContent='';
  const email=$('email').value.trim(), password=$('pass').value;
  if(!email||!password){$('pm').textContent=T[lang].loginError;return}
  $('cont').disabled=true;
  const {error}=await db.auth.signInWithPassword({email,password});
  $('cont').disabled=false;
  if(error){$('pm').textContent=T[lang].loginError;return}
  $('pass').value=''; isAdmin=true; closeModal('admin'); render(); openModal('add');
}

async function uploadFile(file,prefix){
  if(!file)return '';
  const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path=`${prefix}/${Date.now()}-${Math.random().toString(36).slice(2)}-${safe}`;
  const {error}=await db.storage.from('products').upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(error)throw error;
  const {data}=db.storage.from('products').getPublicUrl(path);
  return data.publicUrl;
}

async function addProduct(){
  $('am').textContent='';
  const nameEn=$('nameEn').value.trim(), nameCz=$('nameCz').value.trim();
  if(!nameEn && !nameCz){$('am').textContent=lang==='en'?'Enter at least one name.':'Zadejte alespoň jeden název.';return}
  $('saveProduct').disabled=true; $('saveProduct').textContent=T[lang].saving;
  try{
    const photoFiles=[...$('photo').files], modelFile=$('model').files[0]||null;
    const photoUrls=[];
    for(const file of photoFiles) photoUrls.push(await uploadFile(file,'photos'));
    const modelUrl=await uploadFile(modelFile,'models');
    const row={
      category:$('catSel').value,
      name_en:nameEn||nameCz,
      name_cz:nameCz||nameEn,
      article:$('article').value.trim(),
      material_en:$('materialEn').value.trim(),
      material_cz:$('materialCz').value.trim(),
      size:$('size').value.trim(),
      photo_url:photoUrls[0]||null,
      photo_urls:photoUrls,
      model_url:modelUrl||null
    };
    const {error}=await db.from('products').insert(row);
    if(error)throw error;
    $('am').textContent=T[lang].saved;
    ['nameEn','nameCz','article','materialEn','materialCz','size','photo','model'].forEach(id=>$(id).value='');
    await loadProducts();
    setTimeout(()=>closeModal('add'),700);
  }catch(e){
    console.error(e); $('am').textContent=T[lang].saveError+' '+(e.message||'');
  }finally{
    $('saveProduct').disabled=false; $('saveProduct').textContent=T[lang].addp;
  }
}

function openEdit(p){
  $('editId').value=p.id;
  $('editCatSel').innerHTML=categoryData.map(c=>`<option value="${c[0]}">${c[lang==='en'?1:2]}</option>`).join('');
  $('editCatSel').value=p.category||categoryData[0][0];
  $('editNameEn').value=p.name_en||''; $('editNameCz').value=p.name_cz||'';
  $('editArticle').value=p.article||''; $('editMaterialEn').value=p.material_en||''; $('editMaterialCz').value=p.material_cz||'';
  $('editSize').value=p.size||'';
  $('editPhoto').value='';
  $('editPhoto').dataset.currentPhotos=JSON.stringify(normalizePhotos(p)); $('editModel').value=''; $('em').textContent='';
  openModal('edit');
}

async function updateProduct(){
  $('em').textContent='';
  const id=$('editId').value;
  $('updateProduct').disabled=true; $('updateProduct').textContent=T[lang].saving;
  try{
    const photoFiles=[...$('editPhoto').files], modelFile=$('editModel').files[0]||null;
    const currentPhotos=JSON.parse($('editPhoto').dataset.currentPhotos||'[]');
    const addedPhotos=[];
    for(const file of photoFiles) addedPhotos.push(await uploadFile(file,'photos'));
    const photoUrls=[...new Set([...currentPhotos,...addedPhotos])];
    const row={
      category:$('editCatSel').value,
      name_en:$('editNameEn').value.trim(),
      name_cz:$('editNameCz').value.trim(),
      article:$('editArticle').value.trim(),
      material_en:$('editMaterialEn').value.trim(),
      material_cz:$('editMaterialCz').value.trim(),
      size:$('editSize').value.trim(),
      photo_url:photoUrls[0]||null,
      photo_urls:photoUrls
    };
    if(modelFile) row.model_url=await uploadFile(modelFile,'models');
    const {error}=await db.from('products').update(row).eq('id',id);
    if(error)throw error;
    $('em').textContent=T[lang].savedEdit;
    await loadProducts();
    setTimeout(()=>closeModal('edit'),700);
  }catch(e){
    console.error(e); $('em').textContent=T[lang].editError+' '+(e.message||'');
  }finally{
    $('updateProduct').disabled=false; $('updateProduct').textContent=T[lang].saveChanges;
  }
}

async function deleteProduct(p){
  if(!confirm(T[lang].confirmDelete))return;
  const {error}=await db.from('products').delete().eq('id',p.id);
  if(error){alert(T[lang].editError);return}
  await loadProducts();
}

function openModal(id){$(id).classList.add('open')}
function closeModal(id){$(id).classList.remove('open')}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function escapeAttr(s){return escapeHtml(s)}

$('enBtn').onclick=()=>setLang('en');
$('czBtn').onclick=()=>setLang('cz');
$('addBtn').onclick=(e)=>{e.preventDefault();openModal('admin');setTimeout(()=>$('email').focus(),50)};
$('cont').onclick=login;
$('saveProduct').onclick=addProduct;
$('updateProduct').onclick=updateProduct;
$('search').addEventListener('input',render);
$('gridViewBtn').onclick=()=>setViewMode('grid');
$('listViewBtn').onclick=()=>setViewMode('list');
$('closeAdmin').onclick=()=>closeModal('admin');
$('closeAdd').onclick=()=>closeModal('add');
$('closeEdit').onclick=()=>closeModal('edit');
$('closeViewer').onclick=()=>{closeModal('viewer');$('mv').src=''};

['admin','add','edit','viewer'].forEach(id=>{
  $(id).addEventListener('click',e=>{if(e.target===$(id))closeModal(id)});
});
// Auth listener is isolated so a temporary Auth/API problem cannot break the catalogue UI.
try{
  db.auth.onAuthStateChange((_event, session)=>{ isAdmin=!!session; render(); });
}catch(e){ console.warn('Auth listener unavailable:',e); }

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'));
});

$('gridViewBtn').classList.toggle('active',viewMode==='grid');
$('listViewBtn').classList.toggle('active',viewMode==='list');
$('gridViewBtn').setAttribute('aria-pressed',viewMode==='grid');
$('listViewBtn').setAttribute('aria-pressed',viewMode==='list');
// Render the navigation immediately. The page must remain usable even if Supabase is slow or temporarily unavailable.
setLang('en');
renderCats();

(async()=>{
  // Show the last known catalogue (or the built-in emergency catalogue) immediately.
  const cached=getProductsCache();
  if(cached && cached.length){
    products=cached;
  }else{
    products=fallbackProducts.map(p=>({...p,_db:false}));
  }
  render();

  try{
    // Auth is useful for admin state, but must never block the public catalogue.
    const sessionResult=await Promise.race([
      db.auth.getSession(),
      new Promise(resolve=>setTimeout(()=>resolve({data:{session:null},error:new Error('Auth timeout')}),5000))
    ]);
    if(sessionResult?.data) isAdmin=!!sessionResult.data.session;
  }catch(e){ console.warn('Auth session unavailable:',e); }
  render();

  // Try to refresh from Supabase. If it is slow/down, loadProducts() keeps the cached/emergency copy.
  await loadProducts();
})();
</script>
</body>
</html>
