<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hlavice-01 — 3D</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#fff;padding:28px 24px;border-bottom:1px solid #ddd}
h1{margin:0 0 8px;font-size:28px}
p{margin:0;color:#666}
main{max-width:1000px;margin:30px auto;padding:0 20px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 16px rgba(0,0,0,.1)}
.info{padding:24px}
.name{font-size:24px;font-weight:700;margin-bottom:8px}
.article{color:#666;margin-bottom:18px}
.details{line-height:1.7}
button{margin-top:20px;padding:13px 20px;border:0;border-radius:9px;background:#222;color:#fff;font-size:16px}
.viewer{margin-top:22px}
model-viewer{width:100%;height:650px;background:#eee;border-radius:12px}
</style>
</head>
<body>
<header>
<h1>Каталог мастерской</h1>
<p>Интерактивная 3D-модель</p>
</header>
<main>
<div class="card">
<div class="info">
<div class="name">Коринфская капитель</div>
<div class="article">Артикул: HL-001</div>
<div class="details">
Материал: Гипс / акрил<br>
Размер: укажите размер
</div>
<div class="viewer">
<model-viewer
src="ImageToStl.com_Hlavice-01.glb"
camera-controls
auto-rotate
shadow-intensity="1"
exposure="1"
alt="Коринфская капитель">
</model-viewer>
</div>
</div>
</div>
</main>
</body>
</html>
